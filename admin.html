<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1911 Admin</title>
<meta name="theme-color" content="#0b0806">
<style>
:root{--bg:#090705;--panel:#15100c;--panel2:#1b140e;--gold:#d5ab53;--gold2:#f1d58d;--text:#f8eee0;--muted:rgba(248,238,224,.68);--line:rgba(213,171,83,.18);--danger:#d66b5f;--ok:#83c99a;--shadow:0 20px 60px rgba(0,0,0,.42);--r:22px}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 0%,rgba(213,171,83,.16),transparent 28%),linear-gradient(180deg,#090705,#120c08 45%,#090807);overflow-x:hidden}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{width:min(1440px,calc(100% - 28px));margin:auto;padding:18px 0 50px}
.top{position:sticky;top:12px;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(10,8,6,.88);backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:11px;min-width:210px}.logo{width:46px;height:46px;border-radius:50%;object-fit:contain;border:1px solid rgba(213,171,83,.3);padding:3px;background:#100b08}.brand b{display:block;font-family:Georgia,serif;letter-spacing:.1em}.brand small{color:var(--muted)}
.langs{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:999px;padding:10px 14px;color:var(--text);background:linear-gradient(180deg,#261b13,#120d09);font-weight:750}.btn.active{background:linear-gradient(180deg,var(--gold2),#b47e1e);color:#170f08}.btn.danger{border-color:rgba(214,107,95,.35);color:#ffd7d2}.btn.primary{background:linear-gradient(180deg,var(--gold2),#b47e1e);color:#170f08}
.status{font-size:.78rem;color:var(--muted);padding:0 5px}.status.ok{color:var(--ok)}.status.err{color:#ffaaa1}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;margin-top:18px}.side,.content{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,rgba(24,18,13,.96),rgba(10,8,7,.98));box-shadow:var(--shadow)}.side{padding:12px;height:max-content;position:sticky;top:92px}.nav-title{padding:10px 10px 8px;color:var(--gold2);font-size:.74rem;font-weight:800;letter-spacing:.15em}.nav{display:grid;gap:6px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;border-radius:14px;padding:12px;font-weight:750}.nav button:hover,.nav button.active{background:rgba(213,171,83,.11);border-color:var(--line);color:var(--text)}
.content{padding:18px}.page-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.page-head h1{margin:0;font:700 clamp(1.7rem,3vw,2.5rem) Georgia,serif}.page-head p{margin:5px 0 0;color:var(--muted);max-width:70ch}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.025);padding:16px}.card.full{grid-column:1/-1}.card h2,.card h3{margin:0 0 12px;font-family:Georgia,serif}.card h3{font-size:1.05rem}.fields{display:grid;gap:11px}.field{display:grid;gap:6px}.field label{font-size:.76rem;color:var(--muted);font-weight:800;letter-spacing:.07em;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:13px;background:rgba(0,0,0,.28);color:var(--text);padding:11px 12px;outline:none}.field textarea{min-height:90px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.list{display:grid;gap:8px}.list-item{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid rgba(213,171,83,.12);border-radius:15px;background:rgba(0,0,0,.18)}.list-item .grow{flex:1;min-width:0}.list-item strong,.list-item span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.list-item span{color:var(--muted);font-size:.84rem;margin-top:3px}.icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(213,171,83,.09);border:1px solid var(--line);font-size:1.25rem;flex:0 0 auto}.mini{padding:8px 10px;font-size:.82rem}.empty{padding:25px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.notice{padding:12px 14px;border-radius:14px;background:rgba(213,171,83,.07);border:1px solid var(--line);color:var(--muted);line-height:1.5;font-size:.88rem}.danger-note{border-color:rgba(214,107,95,.3);color:#ffd0cb}
.lang-fields{display:grid;gap:10px}.lang-fields>div{display:none}.lang-fields>div.active{display:grid}.language-indicator{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:10px 12px;border-radius:13px;background:rgba(213,171,83,.07);border:1px solid var(--line)}.language-indicator b{color:var(--gold2)}
.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:680px}.data-table th,.data-table td{padding:10px;border-bottom:1px solid rgba(213,171,83,.1);text-align:left;vertical-align:top}.data-table th{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;border:1px solid var(--line);background:#0c0907}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:.72rem;font-weight:800;background:rgba(131,201,154,.12);color:var(--ok);border:1px solid rgba(131,201,154,.2)}.pill.off{color:#ffaaa1;background:rgba(214,107,95,.1);border-color:rgba(214,107,95,.2)}
.auth{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;background:rgba(4,3,2,.8);backdrop-filter:blur(15px)}.auth-card{width:min(460px,100%);padding:24px;border-radius:28px;border:1px solid var(--line);background:linear-gradient(180deg,#19120d,#0b0907);box-shadow:0 30px 120px rgba(0,0,0,.65)}.auth-card h1{margin:0;font:700 2rem Georgia,serif}.auth-card p{color:var(--muted);line-height:1.5}.error{color:#ffaaa1}.success{color:var(--ok)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center}.grid{grid-template-columns:1fr}}
@media(max-width:600px){.app{width:min(100% - 12px,1440px);padding-top:8px}.top{border-radius:20px}.brand{min-width:0}.status{width:100%}.grid{gap:10px}.content{padding:12px}.nav{grid-template-columns:repeat(2,1fr)}.btn{padding:9px 11px}.card{padding:13px}}
[dir="rtl"] .nav button{text-align:right}[dir="rtl"] .data-table th,[dir="rtl"] .data-table td{text-align:right}
</style>
</head>
<body>
<div id="auth" class="auth">
  <div class="auth-card">
    <div class="brand"><div class="icon">1911</div><div><b>1911 ADMIN</b><small>Owner content management</small></div></div>
    <h1 id="authTitle">Owner sign in</h1>
    <p id="authCopy">Sign in with the existing Firebase staff account. Only an active OWNER profile can use this panel.</p>
    <div class="fields">
      <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
    </div>
    <div class="actions"><button class="btn primary" id="signIn">Sign In</button></div>
    <p id="authStatus" class="status"></p>
  </div>
</div>

<div id="app" class="app hidden">
<header class="top">
  <div class="brand"><img id="topLogo" class="logo" alt="1911"><div><b>1911 ADMIN</b><small id="ownerLine">Content Management System</small></div></div>
  <div class="langs">
    <button class="btn active" data-lang="ku">کوردی</button><button class="btn" data-lang="ar">العربية</button><button class="btn" data-lang="en">English</button>
  </div>
  <div class="row"><span id="sync" class="status">Connecting…</span><button id="logout" class="btn danger">Sign Out</button></div>
</header>

<div class="layout">
<aside class="side">
  <div class="nav-title" id="contentTitle">CONTENT</div>
  <div class="nav">
    <button data-page="brand" class="active">Brand / Header</button>
    <button data-page="sections">Sections</button>
    <button data-page="categories">Categories</button>
    <button data-page="products">Menu Items</button>
    <button data-page="footer">Footer</button>
  </div>
  <div class="nav-title" style="margin-top:12px" id="mediaTitle">MEDIA</div>
  <div class="nav">
    <button data-page="logo">Logo</button>
    <button data-page="images">Menu Images</button>
  </div>
  <div class="nav-title" style="margin-top:12px" id="settingsTitle">SETTINGS</div>
  <div class="nav"><button data-page="general">General Settings</button></div>
</aside>
<main id="content" class="content"></main>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {getAuth,setPersistence,browserLocalPersistence,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {getFirestore,doc,getDoc,getDocs,collection,onSnapshot,writeBatch,setDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const FIREBASE_CONFIG={apiKey:"AIzaSyB_m-lt22FJ7fShyRHDgPEbkYTSOzMpMYM",authDomain:"menu-e4cef.firebaseapp.com",projectId:"menu-e4cef",storageBucket:"menu-e4cef.firebasestorage.app",messagingSenderId:"686608343620",appId:"1:686608343620:web:cbcf3c2c4e149caaee9211",measurementId:"G-RDY676HQLB"};
const IMAGEKIT_AUTH_URL="https://roushworker.zamoahmad490.workers.dev/auth";
const IMAGEKIT_UPLOAD_URL="https://upload.imagekit.io/api/v1/files/upload";
const dbApp=initializeApp(FIREBASE_CONFIG),auth=getAuth(dbApp),db=getFirestore(dbApp);
setPersistence(auth,browserLocalPersistence).catch(()=>{});

const LANGS=["ku","ar","en"];
const LABELS={ku:{brand:"براند / سەرەتا",sections:"بەشەکان",categories:"پۆلەکان",products:"هەڵبژاردەکانی مێنیو",footer:"فۆتەری مێنیو",logo:"لوگو",images:"وێنەکانی مێنیو",general:"ڕێکخستنە گشتییەکان",content:"ناوەڕۆک",media:"میدیا",settings:"ڕێکخستنەکان"},ar:{brand:"العلامة / الرأس",sections:"الأقسام",categories:"الفئات",products:"عناصر القائمة",footer:"التذييل",logo:"الشعار",images:"صور القائمة",general:"الإعدادات العامة",content:"المحتوى",media:"الوسائط",settings:"الإعدادات"},en:{brand:"Brand / Header",sections:"Sections",categories:"Categories",products:"Menu Items",footer:"Footer",logo:"Logo",images:"Menu Images",general:"General Settings",content:"CONTENT",media:"MEDIA",settings:"SETTINGS"}};
const SECTION_DEFAULTS=[
 {id:"cafe",names:{en:"1911 Café",ar:"1911 كافيه",ku:"1911 کافێ"},active:true,order:1},
 {id:"fastfood",names:{en:"1911 Fast Food",ar:"1911 فاست فود",ku:"1911 فاست فود"},active:true,order:2},
 {id:"desserts",names:{en:"1911 Desserts",ar:"1911 حلويات",ku:"1911 دێزەرت"},active:true,order:3}
];

let lang="ku",page="brand",profile=null,businessId="",listeners=[],hydrated=false,saveQueue=[],saveRunning=false,saveTimer=null;
let data={categories:new Map(),products:new Map(),settings:{},inventory:new Map(),orders:new Map(),tables:new Map(),staff:new Map()};
let baseline={categories:new Map(),products:new Map(),settings:{}};

const $=id=>document.getElementById(id);
const clone=v=>JSON.parse(JSON.stringify(v));
const uid=p=>`${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const val=(o,l)=>String(o?.[l]??"");
const text=(o,l)=>val(o,l)||val(o,"en")||val(o,"ar")||val(o,"ku");
const num=v=>String(v??"").replace(/[^0-9]/g,"");
const money=v=>num(v).replace(/\B(?=(\d{3})+(?!\d))/g,",");
const langName=l=>l==="ku"?"کوردی":l==="ar"?"العربية":"English";
const cloudCol=n=>collection(db,"1911POS",businessId,n);
const cloudDoc=(n,id)=>doc(db,"1911POS",businessId,n,String(id));
const settingsRef=()=>doc(db,"1911POS",businessId,"settings","main");
const profileRef=uid=>doc(db,"1911POS",uid);

function setStatus(msg,kind=""){const e=$("sync");e.textContent=msg;e.className="status "+kind}
function ensureObj(v){return v&&typeof v==="object"?v:{}}
function normalizeCategory(raw,id){
 const c={...raw,id:String(raw.id||id)};
 c.names={...ensureObj(c.names),en:val(c.names,"en")||String(c.name||"Category"),ar:val(c.names,"ar")||String(c.name||""),ku:val(c.names,"ku")||String(c.name||"")};
 c.desc={...ensureObj(c.desc),en:val(c.desc,"en")||String(c.description||""),ar:val(c.desc,"ar"),ku:val(c.desc,"ku")};
 c.order=Number(c.order||9999);c.active=c.active!==false;c.menuSectionId=String(c.menuSectionId||c.sectionId||"cafe");return c;
}
function normalizeProduct(raw,id){
 const p={...raw,id:String(raw.id||id)};
 p.names={...ensureObj(p.names),en:val(p.names,"en")||String(p.name||"Item"),ar:val(p.names,"ar"),ku:val(p.names,"ku")};
 p.desc={...ensureObj(p.desc),en:val(p.desc,"en")||String(p.description||""),ar:val(p.desc,"ar"),ku:val(p.desc,"ku")};
 p.available=p.available!==false;p.categoryId=String(p.categoryId||"");p.menuSectionId=String(p.menuSectionId||p.sectionId||"cafe");p.image=String(p.image||p.imageUrl||"");
 p.prices=ensureObj(p.prices);p.prices={small:String(p.prices.small||""),large:String(p.prices.large||"")};
 p.menuPricing=ensureObj(p.menuPricing);return p;
}
function getSections(){const s=Array.isArray(data.settings.menuSections)?data.settings.menuSections:SECTION_DEFAULTS;return clone(s).sort((a,b)=>Number(a.order||0)-Number(b.order||0))}
function getFooter(){return Array.isArray(data.settings.menuFooter)?data.settings.menuFooter:[]}
function getBrand(){return {...{names:{en:"1911",ar:"1911",ku:"1911"},taglines:{en:"",ar:"",ku:""},subtitles:{en:"",ar:"",ku:""},heroText:{en:"",ar:"",ku:""}},...ensureObj(data.settings.menuBrand)}}

function setLang(l){lang=LANGS.includes(l)?l:"ku";document.documentElement.lang=lang==="ar"?"ar":"en";document.documentElement.dir=lang==="en"?"ltr":"rtl";document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));render()}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x.dataset.page===page));render()});
$("logout").onclick=()=>signOut(auth);
$("signIn").onclick=async()=>{try{$("authStatus").textContent="Signing in…";await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("password").value=""}catch(e){$("authStatus").textContent=(e.code||e.message).replace("auth/","").replaceAll("-"," ");$("authStatus").className="status error"}};

async function loadProfile(user){
 const snap=await getDoc(profileRef(user.uid));
 if(!snap.exists())throw new Error("No 1911POS staff profile was found for this Firebase account.");
 const p=snap.data()||{},role=String(p.role||"").toUpperCase(),active=p.active!==false,bid=String(p.businessId||"").trim();
 if(!active)throw new Error("This 1911 staff profile is inactive.");
 if(role!=="OWNER")throw new Error("Owner access required. STAFF accounts cannot use the Menu Admin Panel.");
 if(!bid)throw new Error("The authenticated profile is missing businessId.");
 return {uid:user.uid,email:user.email||p.email||"",role,businessId:bid,name:p.name||"Owner"};
}

async function hydrate(){
 data={categories:new Map(),products:new Map(),settings:{},inventory:new Map(),orders:new Map(),tables:new Map(),staff:new Map()};
 const names=["categories","products","inventory","orders","tables","staff"];
 const snaps=await Promise.all(names.map(n=>getDocs(cloudCol(n))));
 names.forEach((n,i)=>snaps[i].forEach(s=>{const r={id:s.id,...s.data()};data[n].set(s.id,r)}));
 const ss=await getDoc(settingsRef());data.settings=ss.exists()?clone(ss.data()||{}):{};
 baseline={categories:new Map([...data.categories].map(([k,v])=>[k,clone(v)])),products:new Map([...data.products].map(([k,v])=>[k,clone(v)])),settings:clone(data.settings)};
 hydrated=true;render();setStatus("Connected • realtime","ok");
}

function stopListeners(){listeners.forEach(u=>{try{u()}catch{}});listeners=[]}
function startRealtime(){
 stopListeners();
 const managerBusiness=businessId;
 const add=(n,cb)=>listeners.push(onSnapshot(cloudCol(n),s=>{if(businessId!==managerBusiness)return;const m=new Map();s.forEach(x=>m.set(x.id,{id:x.id,...x.data()}));data[n]=m;if(n==="categories")data.categories=new Map([...m].map(([k,v])=>[k,normalizeCategory(v,k)]));if(n==="products")data.products=new Map([...m].map(([k,v])=>[k,normalizeProduct(v,k)]));if(n==="categories"||n==="products")render();},e=>console.warn("Realtime",n,e)));
 add("categories",()=>{});add("products",()=>{});add("inventory",()=>{});add("orders",()=>{});add("tables",()=>{});add("staff",()=>{});
 listeners.push(onSnapshot(settingsRef(),s=>{if(!s.exists())return;data.settings={...s.data()};render()},e=>console.warn("Realtime settings",e)));
}

function snapshotMaps(){return {categories:new Map([...data.categories].map(([k,v])=>[k,clone(v)])),products:new Map([...data.products].map(([k,v])=>[k,clone(v)])),settings:clone(data.settings)}}
function enqueueSave(kind,id,record){
 const op={kind,id,record:record===null?null:clone(record)};
 const existing=saveQueue.findIndex(x=>x.kind===kind&&String(x.id)===String(id));
 if(existing>=0)saveQueue[existing]=op;else saveQueue.push(op);
 if(saveTimer)clearTimeout(saveTimer);
 saveTimer=setTimeout(()=>{saveTimer=null;runSaveQueue()},350);
}
async function runSaveQueue(){
 if(saveRunning||!saveQueue.length||!profile)return;saveRunning=true;
 try{
  while(saveQueue.length){const op=saveQueue.shift();const batch=writeBatch(db);if(op.kind==="settings")batch.set(settingsRef(),op.record,{merge:true});else if(op.record===null)batch.delete(cloudDoc(op.kind,op.id));else batch.set(cloudDoc(op.kind,op.id),op.record,{merge:false});await batch.commit();
   if(op.kind==="settings")baseline.settings=clone(data.settings);else baseline[op.kind].set(op.id,clone(op.record));
  }
  setStatus("Saved • realtime active","ok");
 }catch(e){console.error(e);setStatus("Save failed — local changes kept","err")}finally{saveRunning=false;if(saveQueue.length)runSaveQueue()}
}
function saveSettingsPatch(patch){data.settings={...data.settings,...clone(patch)};enqueueSave("settings","main",patch)}
function saveCategoryRecord(c){data.categories.set(c.id,c);enqueueSave("categories",c.id,c)}
function saveProductRecord(p){data.products.set(p.id,p);enqueueSave("products",p.id,p)}
function deleteRecord(kind,id){data[kind].delete(id);enqueueSave(kind,id,null)}

function uploadImage(file,kind){
 return new Promise(async(resolve,reject)=>{
  try{
   if(!file)return resolve("");
   if(file.size>25*1024*1024)throw new Error("Maximum image size is 25 MB.");
   const a=await fetch(IMAGEKIT_AUTH_URL,{cache:"no-store"});if(!a.ok)throw new Error("ImageKit authentication failed.");
   const authData=await a.json();const fd=new FormData();
   fd.append("file",file);fd.append("fileName",`1911_${kind}_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`);
   fd.append("publicKey","public_PuL65ZSX9Mbdofd/9uXDomIzKH0=");fd.append("signature",authData.signature);fd.append("expire",authData.expire);fd.append("token",authData.token);fd.append("folder","1911MenuAssets");
   const r=await fetch(IMAGEKIT_UPLOAD_URL,{method:"POST",body:fd});if(!r.ok)throw new Error("ImageKit upload failed.");const j=await r.json();resolve(j.url||"");
  }catch(e){reject(e)}
 })
}

function input(id,label,value="",type="text"){return `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`}
function textarea(id,label,value=""){return `<div class="field"><label for="${id}">${esc(label)}</label><textarea id="${id}">${esc(value)}</textarea></div>`}
function langEditor(prefix,label,value){return `<div class="lang-fields"><div class="active">${input(prefix+"_"+lang,label,value)}</div></div>`}
function langField(prefix,label,obj,multi=false){const content=LANGS.map(l=>`<div data-editor-lang="${l}" class="${l===lang?"active":""}">${multi?textarea(prefix+"_"+l,label,val(obj,l)):input(prefix+"_"+l,label,val(obj,l))}</div>`).join("");return `<div class="lang-fields">${content}</div>`}
function readLang(prefix){const o={};LANGS.forEach(l=>{const e=$(prefix+"_"+l);o[l]=e?e.value.trim():""});return o}
function refreshEditorLanguage(){document.querySelectorAll("[data-editor-lang]").forEach(e=>e.classList.toggle("active",e.dataset.editorLang===lang));const i=$("activeLanguage");if(i)i.textContent=langName(lang)}

function render(){
 const l=LABELS[lang];$("contentTitle").textContent=l.content;$("mediaTitle").textContent=l.media;$("settingsTitle").textContent=l.settings;
 $("ownerLine").textContent=profile?`${profile.name} • OWNER • ${businessId}`:"Content Management System";
 $("topLogo").src=getBrand().logo||data.settings.logoUrl||"";
 refreshEditorLanguage();
 const titles={brand:l.brand,sections:l.sections,categories:l.categories,products:l.products,footer:l.footer,logo:l.logo,images:l.images,general:l.general};
 const title=titles[page]||l.brand;
 $("content").innerHTML=`<div class="page-head"><div><h1>${esc(title)}</h1><p>${pageCopy(page)}</p></div></div>${pageHtml(page)}`;
 wirePage(page);refreshEditorLanguage();
}
function pageCopy(p){return ({brand:"Control the customer-visible identity without touching the production menu layout.",sections:"Manage the three top-level menu sections and their translations.",categories:"Create, rename, order and describe menu categories.",products:"Manage names, descriptions, prices, sizes, images, category, section and availability.",footer:"Create any number of customer-facing footer information entries with independent translations.",logo:"Manage the production menu logo using the existing ImageKit pipeline.",images:"Review and replace product images already stored in the shared product records.",general:"Edit menu-level settings while preserving unrelated POS settings."})[p]||""}

function pageHtml(p){
 if(p==="brand")return brandHtml();if(p==="sections")return sectionsHtml();if(p==="categories")return categoriesHtml();if(p==="products")return productsHtml();if(p==="footer")return footerHtml();if(p==="logo")return logoHtml();if(p==="images")return imagesHtml();return generalHtml();
}
function brandHtml(){
 const b=getBrand();return `<div class="grid"><section class="card"><h2>Brand / Header</h2><div class="language-indicator">Editing language: <b id="activeLanguage">${langName(lang)}</b></div>${langField("brandName","Café name",b.names)}${langField("brandSubtitle","Subtitle / tagline",b.taglines)}${langField("brandHero","Hero text",b.heroText,true)}<div class="actions"><button class="btn primary" id="saveBrand">Save Brand</button></div></section><section class="card"><h2>Top information cards</h2><div class="notice">These existing menu cards remain editable. Each language is stored independently.</div>${[0,1,2].map(i=>{const c=(data.settings.menuTopCards||[])[i]||{labels:{},values:{}};return `<div class="card" style="margin-top:10px"><h3>Card ${i+1}</h3>${langField("tc"+i+"l","Label",c.labels)}${langField("tc"+i+"v","Value",c.values)}</div>`}).join("")}<div class="actions"><button class="btn primary" id="saveCards">Save Cards</button></div></section></div>`;
}
function sectionsHtml(){
 const ss=getSections();return `<div class="grid"><section class="card"><h2>Sections</h2><div class="notice">These are the three production menu sections. Names are editable in all three languages. Ordering is customer-visible.</div><div class="list" style="margin-top:12px">${ss.map(s=>`<div class="list-item"><div class="grow"><strong>${esc(text(s.names,lang))}</strong><span>${esc(s.id)} • order ${s.order}</span></div><button class="btn mini" data-edit-section="${esc(s.id)}">Edit</button></div>`).join("")}</div></section><section class="card"><h2>Edit section</h2><div id="sectionEditor"></div></section></div>`;
}
function categoriesHtml(){
 const cats=[...data.categories.values()].map((c,id)=>normalizeCategory(c,id)).sort((a,b)=>a.order-b.order);const selected=$("selectedCat")?.value||cats[0]?.id||"";
 return `<div class="grid"><section class="card"><h2>Categories</h2><div class="row"><button class="btn primary" id="newCat">+ Add category</button></div><div class="list" style="margin-top:12px">${cats.map(c=>`<div class="list-item"><div class="grow"><strong>${esc(text(c.names,lang))}</strong><span>${c.active?"Active":"Hidden"} • ${esc(c.menuSectionId)}</span></div><button class="btn mini" data-edit-cat="${esc(c.id)}">Edit</button></div>`).join("")||'<div class="empty">No categories yet.</div>'}</div></section><section class="card"><h2>Edit category</h2><select id="selectedCat" class="field" style="margin-bottom:12px">${cats.map(c=>`<option value="${esc(c.id)}">${esc(text(c.names,lang))}</option>`).join("")}</select><div id="catEditor"></div></section></div>`;
}
function productsHtml(){
 const ps=[...data.products.values()].map((p,id)=>normalizeProduct(p,id));const cats=[...data.categories.values()].map((c,id)=>normalizeCategory(c,id));return `<section class="card full"><div class="row" style="justify-content:space-between"><div><h2>Menu Items</h2><div class="notice">The editor stores all three translations independently. No automatic translation is performed.</div></div><button class="btn primary" id="newProd">+ Add menu item</button></div><div class="table-wrap" style="margin-top:14px"><table class="data-table"><thead><tr><th>Image</th><th>Name</th><th>Section</th><th>Category</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody>${ps.map(p=>{const c=cats.find(x=>x.id===p.categoryId);const price=p.prices.small||p.prices.large||p.price||"";return `<tr><td>${p.image?`<img class="thumb" src="${esc(p.image)}">`:"—"}</td><td><strong>${esc(text(p.names,lang))}</strong><div class="status">${esc(p.id)}</div></td><td>${esc(getSections().find(s=>s.id===p.menuSectionId)?.names?.[lang]||p.menuSectionId)}</td><td>${esc(c?text(c.names,lang):"—")}</td><td>${money(price)} IQD</td><td><span class="pill ${p.available?"":"off"}">${p.available?"Active":"Hidden"}</span></td><td><button class="btn mini" data-edit-prod="${esc(p.id)}">Edit</button></td></tr>`}).join("")||`<tr><td colspan="7"><div class="empty">No products found.</div></td></tr>`}</tbody></table></div></section><section class="card full"><div id="prodEditor"></div></section>`;
}
function footerHtml(){
 const f=getFooter();return `<section class="card full"><div class="row" style="justify-content:space-between"><div><h2>Custom Footer Information</h2><div class="notice">Add, remove and reorder any information you want. Location, phone, Instagram, opening hours and social links are not hard-coded.</div></div><button class="btn primary" id="newFooter">+ Add Information</button></div><div class="list" id="footerList" style="margin-top:14px">${f.map((x,i)=>`<div class="list-item"><div class="icon">${esc(x.icon||"•")}</div><div class="grow"><strong>${esc(text(x.labels,lang))}</strong><span>${esc(text(x.values,lang))}</span></div><button class="btn mini" data-edit-footer="${i}">Edit</button><button class="btn mini danger" data-del-footer="${i}">Delete</button><button class="btn mini" data-up-footer="${i}">↑</button><button class="btn mini" data-down-footer="${i}">↓</button></div>`).join("")||'<div class="empty">No footer information entries.</div>'}</div><div id="footerEditor" style="margin-top:14px"></div></section>`;
}
function logoHtml(){const b=getBrand();return `<section class="card"><h2>Logo</h2><div class="notice">Existing ImageKit architecture is preserved. The Firestore settings document stores the production image URL/reference.</div><div class="preview-mini" style="margin:15px 0;display:grid;place-items:center;min-height:180px;border:1px solid var(--line);border-radius:18px"><img id="logoPreview" src="${esc(b.logo||data.settings.logoUrl||"")}" style="max-width:180px;max-height:180px;object-fit:contain"></div><div class="field"><label>Replace logo</label><input id="logoFile" type="file" accept="image/*"></div><div class="actions"><button class="btn primary" id="saveLogo">Save Logo</button><button class="btn danger" id="removeLogo">Remove Logo</button></div></section>`}
function imagesHtml(){const ps=[...data.products.values()].map((p,id)=>normalizeProduct(p,id));return `<section class="card full"><h2>Menu Images</h2><div class="notice">Images remain in ImageKit. Removing an image clears its Firestore URL/reference; it does not delete the ImageKit asset.</div><div class="table-wrap" style="margin-top:14px"><table class="data-table"><thead><tr><th>Preview</th><th>Item</th><th>Image</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td>${p.image?`<img class="thumb" src="${esc(p.image)}">`:"—"}</td><td>${esc(text(p.names,lang))}</td><td>${p.image?esc(p.image):"No image"}</td><td><button class="btn mini" data-edit-prod="${esc(p.id)}">Edit</button></td></tr>`).join("")}</tbody></table></div></section>`}
function generalHtml(){return `<section class="card"><h2>General Settings</h2><div class="notice">Only menu-related settings are changed here. Existing POS settings, inventory, orders, tables and staff data are left untouched.</div><div class="fields" style="margin-top:12px">${input("currency","Currency",data.settings.currency||"IQD")}${input("brandPOS","POS brand name",data.settings.brandName||"1911")}</div><div class="actions"><button class="btn primary" id="saveGeneral">Save General Settings</button></div></section>`}

function editorCategory(id){
 const c=normalizeCategory(data.categories.get(id)||{id},id);return `<div class="language-indicator">Editing language: <b id="activeLanguage">${langName(lang)}</b></div>${langField("catName","Category name",c.names)}${langField("catDesc","Description",c.desc,true)}<div class="fields" style="margin-top:12px">${`<div class="field"><label>Section</label><select id="catSection">${getSections().map(s=>`<option value="${esc(s.id)}" ${s.id===c.menuSectionId?"selected":""}>${esc(text(s.names,lang))}</option>`).join("")}</select></div>`}${input("catOrder","Display order",c.order,"number")}<div class="field"><label>Active</label><select id="catActive"><option value="1" ${c.active?"selected":""}>Active</option><option value="0" ${!c.active?"selected":""}>Hidden</option></select></div></div><div class="actions"><button class="btn primary" id="saveCat">Save Category</button><button class="btn danger" id="deleteCat">Delete Category</button></div>`}
function editorProduct(id){
 const p=id?normalizeProduct(data.products.get(id)||{},id):normalizeProduct({id:uid("prd")},uid("prd"));const cats=[...data.categories.values()].map((c,k)=>normalizeCategory(c,k));const ss=getSections();return `<div class="language-indicator">Editing language: <b id="activeLanguage">${langName(lang)}</b></div>${langField("prodName","Item name",p.names)}${langField("prodDesc","Description",p.desc,true)}<div class="grid" style="margin-top:12px"><div class="fields"><div class="field"><label>Section</label><select id="prodSection">${ss.map(s=>`<option value="${esc(s.id)}" ${s.id===p.menuSectionId?"selected":""}>${esc(text(s.names,lang))}</option>`).join("")}</select></div><div class="field"><label>Category</label><select id="prodCategory">${cats.map(c=>`<option value="${esc(c.id)}" ${c.id===p.categoryId?"selected":""}>${esc(text(c.names,lang))}</option>`).join("")}</select></div>${input("prodSingle","Single price (IQD)",p.prices.small||p.prices.large||(!p.prices.small&&!p.prices.large?p.price:""))}</div><div class="fields">${input("prodSmall","Small price (IQD)",p.prices.small)}${input("prodLarge","Large price (IQD)",p.prices.large)}<div class="notice">Leave Large empty when this is a single-price item. The same value is never copied automatically.</div></div></div><div class="grid" style="margin-top:12px">${input("prodImageUrl","Existing image URL",p.image)}<div class="field"><label>Replace image</label><input id="prodImageFile" type="file" accept="image/*"></div></div><div class="fields" style="margin-top:12px"><div class="field"><label>Availability</label><select id="prodAvailable"><option value="1" ${p.available?"selected":""}>Active / visible</option><option value="0" ${!p.available?"selected":""}>Hidden / unavailable</option></select></div></div><div class="actions"><button class="btn primary" id="saveProd">Save Menu Item</button>${id?'<button class="btn danger" id="deleteProd">Delete Menu Item</button>':""}</div>`}

function editorSection(id){
 const s=getSections().find(x=>x.id===id)||{id,names:{en:"",ar:"",ku:""},active:true,order:1};return `<div class="language-indicator">Editing language: <b id="activeLanguage">${langName(lang)}</b></div>${langField("secName","Section name",s.names)}${input("secOrder","Display order",s.order,"number")}<div class="field"><label>Active</label><select id="secActive"><option value="1" ${s.active!==false?"selected":""}>Active</option><option value="0" ${s.active===false?"selected":""}>Hidden</option></select></div><div class="actions"><button class="btn primary" id="saveSection">Save Section</button></div>`}
function editorFooter(index){
 const f=getFooter()[index]||{icon:"",labels:{en:"",ar:"",ku:""},values:{en:"",ar:"",ku:""}};return `<div class="card"><h3>Footer information</h3>${input("footIcon","Icon",f.icon||"")} ${langField("footLabel","Label",f.labels)}${langField("footValue","Value",f.values)}<div class="actions"><button class="btn primary" id="saveFooter">Save Information</button></div></div>`}

function wirePage(p){
 if(p==="brand"){$("saveBrand").onclick=()=>{const b=getBrand();b.names=readLang("brandName");b.taglines=readLang("brandSubtitle");b.heroText=readLang("brandHero");const cards=[];for(let i=0;i<3;i++)cards.push({labels:readLang("tc"+i+"l"),values:readLang("tc"+i+"v")});saveSettingsPatch({menuBrand:b,menuTopCards:cards});render()};$("saveCards").onclick=()=>{const cards=[];for(let i=0;i<3;i++)cards.push({labels:readLang("tc"+i+"l"),values:readLang("tc"+i+"v")});saveSettingsPatch({menuTopCards:cards});render()}}
 if(p==="sections"){const first=getSections()[0]?.id;if(first)showSectionEditor(first);document.querySelectorAll("[data-edit-section]").forEach(b=>b.onclick=()=>showSectionEditor(b.dataset.editSection))}
 if(p==="categories"){const cats=[...data.categories.values()].map((c,id)=>normalizeCategory(c,id));if(cats[0])showCatEditor(cats[0].id);document.querySelectorAll("[data-edit-cat]").forEach(b=>b.onclick=()=>showCatEditor(b.dataset.editCat));$("newCat").onclick=()=>{const id=uid("cat");data.categories.set(id,normalizeCategory({id,name:"New Category",order:cats.length+1,active:true},id));showCatEditor(id)}}
 if(p==="products"){document.querySelectorAll("[data-edit-prod]").forEach(b=>b.onclick=()=>showProdEditor(b.dataset.editProd));$("newProd").onclick=()=>showProdEditor(null)}
 if(p==="footer"){$("newFooter").onclick=()=>showFooterEditor(-1);document.querySelectorAll("[data-edit-footer]").forEach(b=>b.onclick=()=>showFooterEditor(Number(b.dataset.editFooter)));document.querySelectorAll("[data-del-footer]").forEach(b=>b.onclick=()=>{const f=getFooter();f.splice(Number(b.dataset.delFooter),1);saveSettingsPatch({menuFooter:f});render()});document.querySelectorAll("[data-up-footer]").forEach(b=>b.onclick=()=>moveFooter(Number(b.dataset.upFooter),-1));document.querySelectorAll("[data-down-footer]").forEach(b=>b.onclick=()=>moveFooter(Number(b.dataset.downFooter),1))}
 if(p==="logo"){$("logoFile").onchange=e=>{const f=e.target.files?.[0];if(f)$("logoPreview").src=URL.createObjectURL(f)};$("saveLogo").onclick=saveLogo;$("removeLogo").onclick=()=>{const b=getBrand();b.logo="";saveSettingsPatch({menuBrand:b,logoUrl:""});render()}}
 if(p==="images"){}
 if(p==="general")$("saveGeneral").onclick=()=>saveSettingsPatch({currency:$("currency").value.trim()||"IQD",brandName:$("brandPOS").value.trim()||"1911"});
 if(p==="categories")$("selectedCat")?.addEventListener("change",e=>showCatEditor(e.target.value))
}
function showSectionEditor(id){const e=$("sectionEditor");if(!e)return;e.innerHTML=editorSection(id);$("saveSection").onclick=()=>{const ss=getSections(),s=ss.find(x=>x.id===id);if(!s)return;s.names=readLang("secName");s.order=Number($("secOrder").value||1);s.active=$("secActive").value==="1";saveSettingsPatch({menuSections:ss});render()}}
function showCatEditor(id){const e=$("catEditor");if(!e)return;e.innerHTML=editorCategory(id);$("saveCat").onclick=()=>{const c=normalizeCategory(data.categories.get(id)||{id},id);c.names=readLang("catName");c.desc=readLang("catDesc");c.menuSectionId=$("catSection").value;c.order=Number($("catOrder").value||1);c.active=$("catActive").value==="1";saveCategoryRecord(c);render()};$("deleteCat").onclick=()=>{if(!confirm("Delete this category? Products are not automatically deleted."))return;deleteRecord("categories",id);render()}}
function showProdEditor(id){const e=$("prodEditor");if(!e)return;e.innerHTML=editorProduct(id);$("saveProd").onclick=async()=>{try{let p=normalizeProduct(id?data.products.get(id)||{}:{},id||uid("prd"));p.names=readLang("prodName");p.desc=readLang("prodDesc");p.menuSectionId=$("prodSection").value;p.categoryId=$("prodCategory").value;p.available=$("prodAvailable").value==="1";const single=num($("prodSingle").value),small=num($("prodSmall").value),large=num($("prodLarge").value);if(small||large){p.prices={small,large};p.price=Number(small||large||0)}else{p.prices={small:"",large:""};p.price=Number(single||0)}if($("prodImageUrl").value.trim())p.image=$("prodImageUrl").value.trim();const file=$("prodImageFile").files?.[0];if(file)p.image=await uploadImage(file,"item");p.name=p.names.en||p.names.ar||p.names.ku||p.name||"New Item";p.description=p.desc.en||p.desc.ar||p.desc.ku||p.description||"";p.available=p.available!==false;saveProductRecord(p);render()}catch(e){alert(e.message||"Could not save item.")}};if(id)$("deleteProd").onclick=()=>{if(confirm("Delete this menu item?")){deleteRecord("products",id);render()}}}
function showFooterEditor(index){const e=$("footerEditor");if(!e)return;e.innerHTML=editorFooter(index);$("saveFooter").onclick=()=>{const f=getFooter();const item={icon:$("footIcon").value.trim(),labels:readLang("footLabel"),values:readLang("footValue")};if(index<0)f.push(item);else f[index]=item;saveSettingsPatch({menuFooter:f});render()}}
function moveFooter(i,d){const f=getFooter(),j=i+d;if(j<0||j>=f.length)return;[f[i],f[j]]=[f[j],f[i]];saveSettingsPatch({menuFooter:f});render()}
async function saveLogo(){try{const file=$("logoFile").files?.[0];const b=getBrand();if(file)b.logo=await uploadImage(file,"logo");saveSettingsPatch({menuBrand:b,logoUrl:b.logo||""});render()}catch(e){alert(e.message||"Logo upload failed.")}}

async function boot(){
 onAuthStateChanged(auth,async user=>{
  stopListeners();profile=null;businessId="";hydrated=false;$("app").classList.add("hidden");$("auth").classList.remove("hidden");
  if(!user){setStatus("Signed out");return}
  try{
   $("authStatus").textContent="Checking OWNER authorization…";
   profile=await loadProfile(user);businessId=profile.businessId;
   $("auth").classList.add("hidden");$("app").classList.remove("hidden");
   setStatus("Loading shared business data…");await hydrate();startRealtime();render();
  }catch(e){console.error(e);$("authStatus").textContent=e.message||"Access denied.";$("authStatus").className="status error";await signOut(auth).catch(()=>{})}
 });
}
boot();
</script>
